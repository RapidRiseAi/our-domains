# Cloudflare Worker that answers for every domain we own but are not using.
#
# The routes below are generated from src/domains.js. Add a domain there and run
# `npm run routes:sync` rather than editing the generated block by hand.

name = "our-domains"
main = "src/index.js"
compatibility_date = "2026-08-27"

# Keeps a <worker>.workers.dev preview URL around so a new page can be checked
# before any real domain is pointed at it.
workers_dev = true

# BEGIN GENERATED ROUTES - do not edit by hand, run `npm run routes:sync`
routes = [
  { pattern = "integriforensicservices.com", custom_domain = true },
  { pattern = "www.integriforensicservices.com", custom_domain = true },
  { pattern = "bushbabybnb.co.za", custom_domain = true },
  { pattern = "www.bushbabybnb.co.za", custom_domain = true }
]
# END GENERATED ROUTES

[observability]
enabled = true

[vars]
BRAND_NAME = "Rapid Rise AI"
BRAND_URL = "https://www.rapidriseai.com"
CONTACT_EMAIL = "team@rapidriseai.com"
LEGAL_NAME = "Rapid Rise AI (Pty) Ltd"
REGISTRATION_NUMBER = "K2024727338"
TAGLINE = "Custom Software, AI Systems & Business Automation"
# Blank out WHATSAPP_URL to drop the WhatsApp button from the page.
WHATSAPP_URL = "https://wa.me/27649031234"
WHATSAPP_LABEL = "064 903 1234"
